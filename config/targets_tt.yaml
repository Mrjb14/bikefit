# Angles cibles — position contre-la-montre / triathlon
# Toutes les valeurs en degrés.
# Sources : Retül, BikeFit Institute, littérature biomécanique CLM.

# Profils disponibles : clm_court, clm_long, triathlon_XL
# Le profil actif est sélectionné via --profile ou depuis mensurations.yaml

# `largeur_coudes_ratio` : écart entre coudes rapporté à la largeur d'épaules
# (plan frontal, vue de face). Exprimé en ratio et non en mm : une largeur de pads
# n'a de sens que relativement au gabarit du coureur.
# Plus étroit = plus aéro, mais restreint la respiration et la puissance ; on
# s'élargit à mesure que l'épreuve s'allonge.
# Heuristique de fitting, à affiner par l'expérience — comme les coefficients de
# sensibilité ci-dessous. Nécessite la calibration ArUco sur la vue de face.

clm_court:
  genou_extension_pmb:  {min: 140, max: 148, optimal: 144}
  genou_flexion_pmh:    {min: 65,  max: 75,  optimal: 70}
  hanche_fermee_pmh:    {min: 45,  max: 65,  optimal: 55}
  tronc:                {min: 8,   max: 18,  optimal: 12}
  coude:                {min: 88,  max: 100, optimal: 94}
  cheville_pmb:         {min: 130, max: 145, optimal: 137}
  largeur_coudes_ratio: {min: 0.70, max: 0.90, optimal: 0.80}

clm_long:
  genou_extension_pmb:  {min: 140, max: 148, optimal: 144}
  genou_flexion_pmh:    {min: 65,  max: 75,  optimal: 70}
  hanche_fermee_pmh:    {min: 48,  max: 65,  optimal: 56}
  tronc:                {min: 10,  max: 20,  optimal: 15}
  coude:                {min: 88,  max: 100, optimal: 94}
  cheville_pmb:         {min: 130, max: 145, optimal: 137}
  largeur_coudes_ratio: {min: 0.75, max: 0.95, optimal: 0.85}

triathlon_XL:
  genou_extension_pmb:  {min: 140, max: 150, optimal: 145}
  genou_flexion_pmh:    {min: 65,  max: 78,  optimal: 71}
  hanche_fermee_pmh:    {min: 45,  max: 65,  optimal: 55}
  tronc:                {min: 10,  max: 22,  optimal: 16}
  coude:                {min: 88,  max: 105, optimal: 96}
  cheville_pmb:         {min: 128, max: 148, optimal: 138}
  largeur_coudes_ratio: {min: 0.80, max: 1.00, optimal: 0.90}

# Coefficients empiriques de sensibilité (degrés par mm de réglage).
sensitivity:
  genou_extension_per_mm_selle_hauteur: 0.65
  genou_extension_per_mm_selle_recul:   0.15
  hanche_per_mm_prolong_hauteur:        0.30
  coude_per_mm_prolong_longueur:        0.25
  tronc_per_mm_prolong_hauteur:         0.20
