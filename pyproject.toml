[project]
name = "bikefit"
version = "0.1.0"
description = "Analyse vidéo de position cycliste (contre-la-montre) par estimation de pose"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mediapipe>=0.10",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "plotly>=5.20",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
ui = [
    "streamlit>=1.35",
]

[project.scripts]
bikefit = "bikefit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bikefit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
# 3.12 et non 3.11 (le plancher de requires-python) : les stubs embarqués de
# numpy utilisent la syntaxe `type X = ...` que mypy ne sait parser qu'en 3.12+.
# Le support 3.11 reste vérifié à l'exécution par la matrice de tests CI.
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
